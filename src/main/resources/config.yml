# PlexonKeys 1.1.0 | Created for the Plexon family by Tonim (ZpkDxGames)
# Paper 26.2 / Java 25. ALL text uses MiniMessage, not legacy & color codes.
# Percentages: 1.0 = 1%, 0.05 = 0.05%, 100 = always, 0 = never.
# Configure in /keysadmin, or edit this file and run /keysadmin reload.
config-version: 1

settings:
  enabled: true
  # INDEPENDENT: each category rolls once; multiple categories can win per action.
  # HIGHEST_ONLY: Legendary -> Epic -> Rare -> Basic, stop after the first success.
  # In HIGHEST_ONLY, lower categories' effective chances are reduced by prior rolls.
  roll-mode: INDEPENDENT
  max-virtual-per-category: 1000000
  allowed-game-modes: [SURVIVAL]
  # Names are case-insensitive; [] means every world. Exclusions take priority.
  worlds: []
  excluded-worlds: []

storage:
  # Always saves on normal shutdown / plugin disable. No periodic saving by default.
  # /keysadmin save is an asynchronous manual checkpoint.
  # OPTIONAL: 300 saves only dirty rows every 5 minutes, on one background worker.
  # Set 0 to disable. Otherwise minimum 60 seconds, maximum 86400.
  # WARNING: crashes / kill -9 lose changes since the last successful save.
  # SQLite, inventories, and Vault cannot share an atomic transaction; a forced
  # crash can also restore already-claimed keys or roll back acquisition bonuses.
  checkpoint-seconds: 0

tracking:
  # Player placement, pistons, and falling blocks are always tracked, even when
  # rewards/worlds/categories are disabled. No chunk scans or per-block SQL.
  # Growth events after installation are considered non-natural by default.
  exclude-grown-blocks: true
  # Prevent cobblestone/stone/obsidian generators from producing eligible blocks.
  exclude-formed-blocks: true
  # Cannot identify old placements or WorldEdit/other plugins bypassing events.

activities:
  mining:
    enabled: true
    display-name: 'mining'
    # Per player/activity, applied to eligible actions (not just successful rolls).
    # 0 permits each natural block, including multi-block tools, to roll.
    cooldown-ms: 0
    # Respect plugins that suppress block drops, and require a suitable tool.
    require-drops: true
    # Empty = any block, excluding the logging material list.
    materials:
      - STONE
      - DEEPSLATE
      - GRANITE
      - DIORITE
      - ANDESITE
      - TUFF
      - CALCITE
      - NETHERRACK
      - BLACKSTONE
      - BASALT
      - END_STONE
      - COAL_ORE
      - DEEPSLATE_COAL_ORE
      - COPPER_ORE
      - DEEPSLATE_COPPER_ORE
      - IRON_ORE
      - DEEPSLATE_IRON_ORE
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - REDSTONE_ORE
      - DEEPSLATE_REDSTONE_ORE
      - LAPIS_ORE
      - DEEPSLATE_LAPIS_ORE
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - NETHER_GOLD_ORE
      - NETHER_QUARTZ_ORE
      - ANCIENT_DEBRIS
  logging:
    enabled: true
    display-name: 'woodcutting'
    cooldown-ms: 0
    materials: [OAK_LOG, SPRUCE_LOG, BIRCH_LOG, JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG, MANGROVE_LOG, CHERRY_LOG, PALE_OAK_LOG, CRIMSON_STEM, WARPED_STEM]
  fishing:
    enabled: true
    display-name: 'fishing'
    cooldown-ms: 1500
    # Only CAUGHT_FISH with actual item loot counts, never casts or hooked mobs.
    require-open-water: true
  mobs:
    enabled: true
    display-name: 'mob hunting'
    cooldown-ms: 0
    # Empty = all living non-player mobs, except armor stands.
    types: []
    # Paper stores the original spawn reason. Spawners, eggs, commands, breeding,
    # and custom-plugin mobs are excluded by default. [] allows all spawn reasons.
    allowed-spawn-reasons: [NATURAL, CHUNK_GEN, PATROL, RAID, REINFORCEMENTS]

notifications:
  personal-chat: true
  sound: 'minecraft:entity.experience_orb.pickup'
  sound-volume: 0.6
  sound-pitch: 1.2

