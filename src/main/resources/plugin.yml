name: PlexonKeys
version: '${project.version}'
main: com.antondev.keys.PlexonKeys
api-version: '26.2'
description: Activity rewards, virtual keys, and complete admin customization for Plexon.
author: Tonim (ZpkDxGames)
website: https://github.com/ZpkDxGames/PlexonKeys
softdepend: [PlexonCore, Vault]
commands:
  keys:
    description: Open your virtual key collection.
    usage: /keys [claim <category|all>]
    aliases: [plexonkeys]
  keysadmin:
    description: Configure and manage PlexonKeys.
    usage: /keysadmin help
    aliases: [pkeys, pka]
permissions:
  plexonkeys.use:
    description: Open the key menu and claim keys.
    default: true
  plexonkeys.earn:
    description: Earn virtual keys from eligible activities.
    default: true
  plexonkeys.admin:
    description: Configure all settings and manage player balances.
    default: op
