name: Release Candidate

on:
  push:
    branches:
      - 'release/2.0.0-rc.2'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: plexonkeys-2.0.0-rc.2
  cancel-in-progress: false

env:
  PLUGIN_VERSION: '2.0.0-rc.2'
  RELEASE_TAG: 'v2.0.0-rc.2'
  CANDIDATE_BRANCH: 'phase3/runtime-reliability'
  ROLLBACK_TAG: 'v1.4.1'
  ROLLBACK_SHA: 'c06a9e4107fc259f45d32d1f0767e5e2b5d1d872'

jobs:
  publish-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify candidate identity and draft PR boundary
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "release/${PLUGIN_VERSION}"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "${PLUGIN_VERSION}"
          test -f "releases/${PLUGIN_VERSION}.md"
          candidate_sha=$(git ls-remote origin "refs/heads/${CANDIDATE_BRANCH}" | cut -f1)
          test -n "$candidate_sha"
          test "$candidate_sha" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; refusing to move or replace an RC tag." >&2
            exit 1
          fi
          gh pr list --head "$CANDIDATE_BRANCH" --base main --state open --json number,isDraft,headRefOid > target-pr.json
          python3 - <<'PY'
          import json, os
          prs=json.load(open('target-pr.json', encoding='utf-8'))
          if len(prs) != 1:
              raise SystemExit(f'Expected exactly one open Phase 3 PR, found {len(prs)}')
          pr=prs[0]
          if not pr['isDraft']:
              raise SystemExit('Phase 3 PR must remain draft')
          if pr['headRefOid'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Phase 3 PR head does not match release candidate SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"number={pr['number']}\n")
          PY

      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Full release-candidate verification
        run: mvn -B -ntp clean verify

      - name: Build exact test summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, pathlib, sys, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              for case in ET.parse(path).getroot().iter('testcase'):
                  tests += 1
                  failures += case.find('failure') is not None
                  errors += case.find('error') is not None
                  skipped += case.find('skipped') is not None
          if tests == 0:
              raise SystemExit('No tests discovered')
          pathlib.Path('target/TEST_SUMMARY.txt').write_text(
              f'tests={tests}\nfailures={failures}\nerrors={errors}\nskipped={skipped}\n', encoding='utf-8')
          if failures or errors or skipped:
              raise SystemExit(f'RC suite not clean: {tests=} {failures=} {errors=} {skipped=}')
          print(f'Release candidate tests: {tests}; failures=0; errors=0; skipped=0')
          PY

      - name: Verify distribution, isolation, class version and checksum
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/PlexonKeys-${PLUGIN_VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          for required in \
            plugin.yml \
            com/antondev/keys/PlexonKeys.class \
            com/antondev/keys/api/PlexonKeysAPI.class \
            com/antondev/keys/api/KeyConsumeResult.class \
            com/antondev/keys/api/KeyDefinitionView.class \
            com/antondev/keys/event/PlexonKeyConsumedEvent.class \
            com/antondev/keys/integration/papi/PlexonKeysExpansion.class \
            org/sqlite/JDBC.class; do
            grep -qx "$required" target/jar-contents.txt
          done
          unzip -p "$JAR" plugin.yml | grep -F "version: '${PLUGIN_VERSION}'"
          unzip -p "$JAR" plugin.yml | grep -F 'main: com.antondev.keys.PlexonKeys'
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${PLUGIN_VERSION}"
          javap -verbose -classpath "$JAR" com.antondev.keys.PlexonKeys | grep -F 'major version: 69'
          for prefix in 'com/zpkdxgames/plexoncore/' 'me/clip/placeholderapi/' 'com/plexon/spawners/' 'com/antondev/crates/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided/optional integration classes must not be shaded: ${prefix}" >&2
              exit 1
            fi
          done
          (cd target && sha256sum "PlexonKeys-${PLUGIN_VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          git diff --check "${ROLLBACK_SHA}...HEAD"

      - name: Write exact provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > target/PROVENANCE.txt <<EOF
          repository=ZpkDxGames/PlexonKeys
          candidate_branch=${CANDIDATE_BRANCH}
          release_branch=${GITHUB_REF_NAME}
          candidate_sha=${GITHUB_SHA}
          version=${PLUGIN_VERSION}
          rollback_tag=${ROLLBACK_TAG}
          rollback_sha=${ROLLBACK_SHA}
          java=25
          paper=26.2.build.121-stable
          plexoncore=2.0.4
          config_schema=1
          database_schema=2
          pr=${{ steps.pr.outputs.number }}
          pr_state=OPEN_DRAFT_UNMERGED
          runtime_certification=NOT_EXECUTED
          EOF

      - name: Tag exact verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "target/PlexonKeys-${PLUGIN_VERSION}.jar" \
            target/SHA256SUMS.txt target/TEST_SUMMARY.txt target/PROVENANCE.txt \
            --verify-tag --prerelease --target "${GITHUB_SHA}" \
            --title "PlexonKeys ${PLUGIN_VERSION}" --notes-file "releases/${PLUGIN_VERSION}.md"

      - name: Post-publication verification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          mkdir -p target/published
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,targetCommitish,assets > target/release.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('target/release.json', encoding='utf-8'))
          if data['tagName'] != os.environ['RELEASE_TAG']:
              raise SystemExit('release tag mismatch')
          if not data['isPrerelease']:
              raise SystemExit('release is not marked prerelease')
          names={asset['name'] for asset in data['assets']}
          expected={f"PlexonKeys-{os.environ['PLUGIN_VERSION']}.jar", 'SHA256SUMS.txt', 'TEST_SUMMARY.txt', 'PROVENANCE.txt'}
          if names != expected:
              raise SystemExit(f'asset set mismatch: {names} != {expected}')
          PY
          gh release download "$RELEASE_TAG" --dir target/published
          for file in "PlexonKeys-${PLUGIN_VERSION}.jar" SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt; do
            cmp "target/$file" "target/published/$file"
          done
          (cd target/published && sha256sum --check SHA256SUMS.txt)
          gh pr view "$PR_NUMBER" --json state,isDraft,mergedAt,headRefOid > target/pr-after.json
          python3 - <<'PY'
          import json, os
          pr=json.load(open('target/pr-after.json', encoding='utf-8'))
          if pr['state'] != 'OPEN' or not pr['isDraft'] or pr['mergedAt'] is not None:
              raise SystemExit('Phase 3 PR is no longer OPEN / DRAFT / UNMERGED')
          if pr['headRefOid'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Phase 3 PR moved after candidate verification')
          PY
          if gh release view "v2.0.0" >/dev/null 2>&1; then
            echo 'Stable v2.0.0 must remain unpublished.' >&2
            exit 1
          fi
