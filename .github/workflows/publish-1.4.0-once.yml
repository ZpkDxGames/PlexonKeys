name: Publish PlexonKeys 1.4.0 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.0-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Guard exact version
        shell: bash
        run: |
          set -euo pipefail
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "${version}" = "1.4.0"
          if gh release view v1.4.0 >/dev/null 2>&1; then
            echo "v1.4.0 already exists; refusing duplicate publication" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Provision PlexonCore 2.0.2 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.2.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.2/PlexonCore-2.0.2.jar"
          echo "7e096ada4293017203cd4e01cb93761d169fa4c756fc46af520b2aed11a10ef5  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.2 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Verify and build exact main commit
        run: mvn -B -ntp clean verify

      - name: Verify distribution and checksum
        shell: bash
        run: |
          set -euo pipefail
          jar_path=target/PlexonKeys-1.4.0.jar
          test -s "${jar_path}"
          jar tf "${jar_path}" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/antondev/keys/PlexonKeys.class' target/jar-contents.txt
          grep -qx 'com/antondev/keys/api/PlexonKeysAPI.class' target/jar-contents.txt
          grep -qx 'com/antondev/keys/event/PlexonKeyEarnedEvent.class' target/jar-contents.txt
          grep -qx 'com/antondev/keys/event/PlexonKeyClaimedEvent.class' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
            echo "PlexonCore runtime classes must not be shaded into PlexonKeys" >&2
            exit 1
          fi
          cd target
          sha256sum PlexonKeys-1.4.0.jar > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish v1.4.0
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.4.0 \
            target/PlexonKeys-1.4.0.jar \
            target/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "PlexonKeys 1.4.0" \
            --notes-file releases/1.4.0.md
        env:
          GH_TOKEN: ${{ github.token }}
