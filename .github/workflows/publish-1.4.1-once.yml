name: Publish PlexonKeys 1.4.1 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.1-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision verified PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Build and verify exact merged commit
        run: mvn -B -ntp clean verify

      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/PlexonKeys-1.4.1.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/antondev/keys/PlexonKeys.class' target/jar-contents.txt
          grep -qx 'com/antondev/keys/api/PlexonKeysAPI.class' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '1.4.1'"
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then exit 1; fi
          sha256sum "$JAR" > target/SHA256SUMS.txt
          (cd target && sha256sum --check SHA256SUMS.txt)

      - name: Publish immutable v1.4.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.1 >/dev/null 2>&1; then
            echo 'v1.4.1 already exists; refusing to replace immutable release assets.'
            exit 0
          fi
          gh release create v1.4.1 \
            target/PlexonKeys-1.4.1.jar \
            target/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'PlexonKeys 1.4.1' \
            --notes-file releases/1.4.1.md
