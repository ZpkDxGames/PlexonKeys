name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision PlexonCore 2.0.2 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.2.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.2/PlexonCore-2.0.2.jar"
          echo "7e096ada4293017203cd4e01cb93761d169fa4c756fc46af520b2aed11a10ef5  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.2 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and package
        run: mvn -B -ntp clean verify

      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          project_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          expected="PlexonKeys-${project_version}.jar"
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'PlexonKeys-*.jar' -print)
          test "${#jars[@]}" -eq 1
          jar_path=${jars[0]}
          test -s "${jar_path}"
          test "$(basename "${jar_path}")" = "${expected}"
          jar tf "${jar_path}" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/antondev/keys/PlexonKeys.class' target/jar-contents.txt
          grep -qx 'com/antondev/keys/api/PlexonKeysAPI.class' target/jar-contents.txt
          grep -qx 'com/antondev/keys/event/PlexonKeyEarnedEvent.class' target/jar-contents.txt
          grep -qx 'com/antondev/keys/event/PlexonKeyClaimedEvent.class' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
            echo "PlexonCore runtime classes must not be shaded into PlexonKeys" >&2
            exit 1
          fi
          cd target
          sha256sum "${expected}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Check whitespace
        run: git diff --check origin/main...HEAD

      - name: Resolve artifact metadata
        id: meta
        shell: bash
        run: |
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PlexonKeys-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            target/PlexonKeys-${{ steps.meta.outputs.version }}.jar
            target/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
